<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8102e">
<title>Mr. Strandberg's Hall Pass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
:root{
  --accent:#c8102e; --accent2:#1f3f8f; --accent-ink:#fff; --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#eef0f6; --ink:#1a1d29; --muted:#5f6577; --line:#dfe2ec;
  --warn:#b7791f; --warn-soft:#fdf1dc; --bad:#b4372f; --bad-soft:#fbe3e0; --ok:#2f7d4f; --ok-soft:#e1f2e7;
  --radius:14px; --shadow:0 1px 2px rgb(0 0 0/.05),0 6px 24px rgb(0 0 0/.06);
  --tile-min:150px; --tile-font:1.15rem; --tile-pad:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131c; --panel:#181c28; --panel-2:#212636; --ink:#eef0f6; --muted:#9aa1b5; --line:#2e3446;
    --warn:#e3a94a; --warn-soft:#3a2f1c; --bad:#f07a6e; --bad-soft:#3d2220; --ok:#6cc58f; --ok-soft:#1c3326;
    --shadow:0 1px 2px rgb(0 0 0/.3),0 6px 24px rgb(0 0 0/.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c; --panel:#181c28; --panel-2:#212636; --ink:#eef0f6; --muted:#9aa1b5; --line:#2e3446;
  --warn:#e3a94a; --warn-soft:#3a2f1c; --bad:#f07a6e; --bad-soft:#3d2220; --ok:#6cc58f; --ok-soft:#1c3326;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 6px 24px rgb(0 0 0/.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.25rem}
h3{font-size:1rem}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .05s,background .15s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=password],select,textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:160px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:80px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
label.field>input,label.field>select{color:var(--ink);font-weight:400;font-size:1rem}
.check{display:inline-flex;gap:8px;align-items:center}

/* layout */
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack>p,.card>p{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem}
.brand .emoji{font-size:1.4rem}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
:root[data-theme="dark"] .tabs button.on{color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}

/* out cards */
.outlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.outcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.outcard .who{font-weight:700;font-size:1.05rem}
.outcard .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem}
.outcard.overdue{background:var(--bad-soft);border-color:var(--bad)}
.outcard.overdue .timer{color:var(--bad)}
.outcard.near{background:var(--warn-soft);border-color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);position:sticky;top:0;cursor:default}
th.sort{cursor:pointer}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.void td{opacity:.45;text-decoration:line-through}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* kiosk */
body.kiosk{user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.k-head{display:flex;align-items:center;gap:14px;padding:16px 22px;flex-wrap:wrap}
.k-title{font-size:1.6rem;font-weight:800}
.k-sub{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
.k-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.4rem}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));gap:12px;padding:6px 22px 120px}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:var(--tile-pad);text-align:left;font-size:var(--tile-font);font-weight:700;min-height:calc(var(--tile-pad)*2 + 2.6em);display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:var(--shadow);transition:transform .06s}
.tile:active{transform:scale(.97)}
.tile .st{font-size:.72em;font-weight:700;color:var(--warn)}
.tile.out{background:var(--warn-soft);border-color:var(--warn)}
.tile.out.overdue{background:var(--bad-soft);border-color:var(--bad)}
.tile.out.overdue .st{color:var(--bad)}
.k-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.k-banner{margin:0 22px 10px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dest{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:20px 14px;font-weight:800;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dest .ic{font-size:2.2rem;line-height:1}
.dest small{font-weight:600;color:var(--muted);font-size:.75rem}
.dest:not(:disabled):hover{border-color:var(--accent)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0/.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .12s}
.modal{background:var(--panel);border-radius:20px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgb(0 0 0/.3)}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgb(0 0 0/.25);animation:fade .15s;width:100%}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.toast.big{font-size:1.2rem;padding:16px 20px}

/* brand: logo + red/white/blue stripe */
img.logo{display:block;width:auto;object-fit:contain;filter:drop-shadow(0 1px 1px rgb(0 0 0/.15))}
.stripe{height:6px;background:linear-gradient(90deg,var(--accent) 0 40%,#fff 40% 60%,var(--accent2) 60% 100%)}
.topbar .inner .brand{color:var(--accent2)}
:root[data-theme="dark"] .topbar .inner .brand{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar .inner .brand{color:var(--ink)}}
.tabs button.on{background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2)}
.stat b{color:var(--accent2)}
:root[data-theme="dark"] .stat b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat b{color:var(--ink)}}
.bar.alt{background:var(--accent2)}
.day{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:2px solid currentColor}
.day.red{color:#fff;background:var(--accent);border-color:var(--accent)}
.day.white{color:var(--accent2);background:#fff;border-color:var(--accent2)}
.day.mon{color:#fff;background:var(--accent2);border-color:var(--accent2)}
.daypick{cursor:pointer;opacity:.45;font:inherit;font-weight:800;font-size:.8rem;padding:6px 14px}
.daypick.sel{opacity:1;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
:root[data-theme="dark"] .tabs button.on{color:var(--ink);background:color-mix(in srgb,var(--accent2) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:var(--ink);background:color-mix(in srgb,var(--accent2) 45%,transparent)}}
.preset{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px 5px 6px;font-weight:600;font-size:.85rem}
.preset .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.preset.on{outline:2px solid var(--ink)}
.logobox{width:64px;height:64px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:12px;padding:6px}
.logobox img{max-width:100%;max-height:100%}
.bells td.cur{background:var(--accent-soft);font-weight:700}

.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 7%,var(--panel))}

/* setup */
.hero{max-width:720px;margin:8vh auto 0;padding:0 16px;text-align:center}
.hero h1{font-size:2.2rem;margin:10px 0}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:28px;text-align:left}
.choice button{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:6px}
.choice button:hover{border-color:var(--accent)}
.choice b{font-size:1.15rem}
.choice .ic{font-size:2rem}

.sched{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:10px}
.daybtn{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.8rem}
.daybtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qr{background:#fff;padding:0;border-radius:14px;display:inline-block;line-height:0}
.qr img{width:240px;height:240px;image-rendering:pixelated;border-radius:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;font-weight:800;letter-spacing:.12em;background:var(--panel-2);padding:6px 12px;border-radius:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel);outline:1px solid var(--line)}
.swatch.on{outline:3px solid var(--ink)}
.destrow{display:grid;grid-template-columns:56px 1fr 90px 90px auto auto;gap:8px;align-items:center}
.destrow input{width:100%}
@media (max-width:640px){
  .destrow{grid-template-columns:48px 1fr 70px 70px;}
  .destrow .x{grid-column:span 2}
  .k-head,.k-grid{padding-left:16px;padding-right:16px}
  .k-title{font-size:1.25rem}
}
@media print{
  .topbar,.noprint,.btn{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

  if (L.perWeek && week >= L.perWeek) return `You've used your ${L.perWeek} passes for this week.`;

const logoSrc = () => { const l = C().theme.logo; return l === 'default' ? DEFAULT_LOGO : (l && l.startsWith('data:image/') ? l : ''); };
function brandMark(px = 32) {
  const src = logoSrc();
  return src ? `<img class="logo" src="${src}" alt="" style="height:${px}px">` : `<span style="font-size:${Math.round(px * .85)}px;line-height:1">${esc(C().theme.emoji || '🐦')}</span>`;
}
function applyTheme() {
  const t = C().theme, r = document.documentElement;
  r.style.setProperty('--accent', t.accent);
  r.style.setProperty('--accent2', t.accent2 || t.accent);
  const h = t.accent.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  const lum = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  r.style.setProperty('--accent-ink', lum > 0.62 ? '#1d1b17' : '#ffffff');
  if (t.mode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t.mode);
  const sz = { s: ['130px', '1rem', '14px'], m: ['160px', '1.15rem', '18px'], l: ['200px', '1.4rem', '24px'], xl: ['250px', '1.75rem', '30px'] }[C().kiosk.size] || ['160px', '1.15rem', '18px'];
  r.style.setProperty('--tile-min', sz[0]); r.style.setProperty('--tile-font', sz[1]); r.style.setProperty('--tile-pad', sz[2]);
  document.title = t.title || 'Hall Pass';
  $('meta[name=theme-color]')?.setAttribute('content', t.accent);
  const link = $('link[rel=icon]'); if (link) link.href = logoSrc() || `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${t.emoji || '🐦'}</text></svg>`;
}

/* ---------- ui primitives ---------- */
function toast(html, { undo, ms = 3500, big } = {}) {
  const el = document.createElement('div'); el.className = 'toast' + (big ? ' big' : '');
  el.innerHTML = `<span style="flex:1">${html}</span>${undo ? '<button class="btn sm">Undo</button>' : ''}`;
  $('#toasts').appendChild(el);
  const kill = () => el.remove();
  if (undo) el.querySelector('button').onclick = () => { undo(); kill(); };
  setTimeout(kill, ms);
}
function modal(html, { onClose, dismiss = true } = {}) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  if (dismiss) bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  bg._onClose = onClose; document.body.appendChild(bg);
  return bg.firstElementChild;
}
function closeModal() { const m = $('#modal'); if (m) { m.remove(); m._onClose?.(); } }
let modalTimer = null;

let audioCtx = null;
function beep() {
  if (!C().alerts.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i ? 660 : 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + d; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.start(t); o.stop(t + .2);
    });
  } catch { }
}

/* ============================================================
   ROSTER FILE IMPORT — CSV / TSV / Excel (.xlsx)
   Reads files exported from a gradebook / SIS (PowerSchool,
   Infinite Campus, JMC, Google Sheets…), guesses which columns
   hold names and periods, groups students into classes, and
   lets the teacher check everything before importing.
   ============================================================ */

/* ---------- CSV ---------- */
function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = [',', '\t', ';', '|'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}

/* ---------- XLSX (zip of XML) without a library ---------- */
async function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('not a zip');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const out = {}, dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), loff = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!/^xl\/(sharedStrings\.xml|workbook\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^/]+\.xml)$/.test(name)) continue;
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    const data = u8.subarray(start, start + csize);
    if (method === 0) out[name] = dec.decode(data);
    else if (method === 8) {
      if (!('DecompressionStream' in window)) throw new Error('This browser can’t open Excel files. Save the sheet as CSV instead.');
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      out[name] = await new Response(stream).text();
    }
  }
  return out;
}
async function parseXlsx(buf) {
  const z = await unzipEntries(buf), xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const strings = z['xl/sharedStrings.xml'] ? [...xml(z['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  // first sheet in workbook order
  let sheetPath = 'xl/worksheets/sheet1.xml';
  try {
    const wb = xml(z['xl/workbook.xml']), rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
    const rel = [...xml(z['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid);
    const t = rel.getAttribute('Target').replace(/^\/?(xl\/)?/, ''); if (z['xl/' + t]) sheetPath = 'xl/' + t;
  } catch { }
  if (!z[sheetPath]) sheetPath = Object.keys(z).find(k => k.startsWith('xl/worksheets/'));
  if (!z[sheetPath]) throw new Error('No sheet found in that file.');
  const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const rows = [];
  for (const r of xml(z[sheetPath]).getElementsByTagName('row')) {
    const row = [];
    for (const c of r.getElementsByTagName('c')) {
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent ?? '';
      const val = t === 's' ? strings[+v] ?? '' : t === 'inlineStr' ? [...c.getElementsByTagName('t')].map(x => x.textContent).join('') : v;
      row[colIdx(c.getAttribute('r') || '')] = String(val).trim();
    }
    rows.push(Array.from(row, x => x ?? ''));
  }
  return rows.filter(r => r.some(Boolean));
}

async function readRosterFile(file) {
  if (/\.xlsx$/i.test(file.name)) return parseXlsx(await file.arrayBuffer());
  if (/\.xls$/i.test(file.name)) throw new Error('Old .xls files aren’t supported. Open it and save as .xlsx or .csv.');
  return parseDelimited(await file.text());
}

/* ---------- column guessing ---------- */
const COLS = [
  ['full', 'Full name'], ['first', 'First name'], ['last', 'Last name'], ['period', 'Period'], ['course', 'Class / course'],
];
function guessColumns(header) {
  const h = header.map(x => x.toLowerCase().replace(/[_.]/g, ' ').trim());
  const find = (...res) => { for (const re of res) { const i = h.findIndex(x => re.test(x)); if (i >= 0) return i; } return -1; };
  const g = {
    first: find(/^preferred\s*first/, /^first\s*name$/, /^first$/, /\bfirst\b/, /given/),
    last: find(/^last\s*name$/, /^last$/, /\blast\b/, /surname|family/),
    full: find(/^(student\s*)?name$/, /full\s*name/, /^student$/, /student\s*name/, /last\s*,\s*first/, /name/),
    period: find(/^period$/, /^per$/, /period|^per\b|^hour$|^hr$|block|expression/),
    course: find(/^course\s*name$/, /^course$/, /^class$/, /course|class(?!\s*of)|section|subject/),
  };
  if (g.first >= 0 && g.last >= 0) g.full = -1; // prefer separate columns
  if (g.full === g.first || g.full === g.last) g.full = -1;
  if (g.course === g.period) g.course = -1;
  return g;
}

const toPeriod = v => {
  v = String(v || '').trim(); if (!v) return '';
  if (/advis|homeroom|\bhr\b/i.test(v)) return 'ADV';
  if (/interv|flex|wit/i.test(v)) return 'INT';
  const m = v.match(/(?:^|[^\d])0?([1-8])(?:\D|$)/); return m ? 'P' + m[1] : '';
};
const cleanCourse = v => String(v || '').replace(/\s*[-–(]?\s*(?:per(?:iod)?\.?|p)\s*\d+\)?\s*$/i, '').replace(/\s+/g, ' ').trim();

/* ---------- import dialog ---------- */
function rosterImport(files) {
  files = [...files].filter(f => /\.(csv|tsv|txt|xlsx|xls)$/i.test(f.name) || /csv|excel|spreadsheet|text/.test(f.type));
  if (!files.length) return toast('Choose a .csv or .xlsx file');
  Promise.all(files.map(f => readRosterFile(f).then(rows => ({ file: f.name.replace(/\.[^.]+$/, ''), rows })).catch(e => ({ file: f.name, error: e.message || 'Could not read' }))))
    .then(sheets => {
      const bad = sheets.filter(s => s.error); bad.forEach(s => toast(`${esc(s.file)}: ${esc(s.error)}`, { ms: 6000 }));
      const ok = sheets.filter(s => !s.error && s.rows.length);
      if (ok.length) importDialog(ok);
    });
}

function importDialog(sheets) {
  // one mapping per file (files usually share a format, so the first file's guess seeds the rest)
  const maps = sheets.map(s => {
    const hasHeader = looksLikeHeader(s.rows[0]);
    const header = hasHeader ? s.rows[0] : s.rows[0].map((_, i) => `Column ${i + 1}`);
    let g = hasHeader ? guessColumns(header) : { full: 0, first: -1, last: -1, period: -1, course: -1 };
    if (!hasHeader && s.rows[0].length >= 2 && s.rows.every(r => r.length >= 2 && !/\d/.test(r[0] + r[1]))) g = { full: -1, last: 0, first: 1, period: -1, course: -1 };
    return { hasHeader, header, g };
  });
  let fi = 0; // which file's mapping is being shown
  let groups = []; // [{key,name,period,students[],include}]
  const filePeriod = name => toPeriod(name.match(/(?:period|per|p|hour)\s*\.?\s*\d/i)?.[0] || '');

  const build = () => {
    const prev = new Map(groups.map(g => [g.key, g]));
    const by = new Map();
    sheets.forEach((s, i) => {
      const { g, hasHeader } = maps[i];
      for (const r of s.rows.slice(hasHeader ? 1 : 0)) {
        let name = g.first >= 0 || g.last >= 0 ? `${r[g.first] || ''} ${r[g.last] || ''}`.trim() : (r[g.full] || '');
        if (!name || /^(total|count)\b/i.test(name)) continue;
        const per = g.period >= 0 ? toPeriod(r[g.period]) : '';
        const course = g.course >= 0 ? cleanCourse(r[g.course]) : '';
        const p = per || toPeriod(course.match(/(?:period|per|p)\s*\.?\s*\d/i)?.[0] || '') || filePeriod(s.file);
        const key = `${p}|${course || (g.period < 0 && g.course < 0 ? s.file : '')}`;
        if (!by.has(key)) {
          const old = prev.get(key);
          let label = (course || (g.period < 0 && g.course < 0 ? s.file : '')).replace(/^(?:period|per|p|hour)\s*\.?\s*\d+\s*[-–·:_]?\s*/i, '').trim();
          if (p && label.toLowerCase() === periodName(p).toLowerCase()) label = '';
          by.set(key, old ? { ...old, students: [] } : { key, period: p, name: [p ? periodName(p) : '', label].filter(Boolean).join(' · ') || 'Imported class', students: [], include: true });
        }
        by.get(key).students.push(name);
      }
    });
    groups = [...by.values()].sort((a, b) => (a.period || 'Z').localeCompare(b.period || 'Z') || a.name.localeCompare(b.name));
  };

  const m = modal('', { dismiss: false });
  m.style.maxWidth = '820px';
  const draw = () => {
    build();
    const mp = maps[fi], s = sheets[fi];
    const opt = (k) => `<select data-map="${k}"><option value="-1">—</option>${mp.header.map((h, i) => `<option value="${i}" ${mp.g[k] === i ? 'selected' : ''}>${esc(h || `Column ${i + 1}`)}</option>`).join('')}</select>`;
    const sample = s.rows.slice(mp.hasHeader ? 1 : 0, (mp.hasHeader ? 1 : 0) + 3);
    const total = groups.filter(g => g.include).reduce((a, g) => a + g.students.length, 0);
    const existing = new Set(C().classes.map(c => c.name.toLowerCase()));
    m.innerHTML = `<h2>Import rosters</h2>
      <p class="small muted">Check that the columns are right, then the classes below. Names are shortened to first name + last initial${C().kiosk.shortNames ? '' : ' (turned off in Settings)'}. Only names are kept, no IDs or other info.</p>
      ${sheets.length > 1 ? `<div class="row small" style="margin:8px 0">File: ${sheets.map((x, i) => `<button class="btn sm ${i === fi ? 'primary' : ''}" data-file="${i}">${esc(x.file)}</button>`).join('')}</div>` : `<div class="small muted">File: <b>${esc(s.file)}</b> · ${s.rows.length - (mp.hasHeader ? 1 : 0)} rows</div>`}
      <div class="card stack" style="margin-top:10px;padding:14px">
        <div class="row">${COLS.map(([k, l]) => `<label class="field">${l}${opt(k)}</label>`).join('')}</div>
        <label class="check small"><input type="checkbox" id="hdr" ${mp.hasHeader ? 'checked' : ''}> First row is column titles</label>
        <div class="tablewrap"><table class="small"><thead><tr>${mp.header.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${sample.map(r => `<tr>${mp.header.map((_, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      </div>
      <h3 style="margin:16px 0 8px">${groups.length} class${groups.length === 1 ? '' : 'es'} · ${total} students</h3>
      <div class="stack" style="gap:8px">${groups.map((g, i) => `
        <div class="row" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">
          <input type="checkbox" data-inc="${i}" ${g.include ? 'checked' : ''} aria-label="Include">
          <input type="text" data-name="${i}" value="${esc(g.name)}" style="flex:1;min-width:160px">
          <select data-per="${i}">${PERIODS.map(([k, l]) => `<option value="${k}" ${g.period === k ? 'selected' : ''}>${l}</option>`).join('')}<option value="" ${!g.period ? 'selected' : ''}>No period</option></select>
          <span class="small muted" title="${esc(g.students.join(', '))}">${g.students.length} students${existing.has(g.name.toLowerCase()) ? ' · <b>updates existing</b>' : ''}</span>
        </div>`).join('') || '<div class="empty">No students found. Pick the name column(s) above.</div>'}</div>
      <label class="check small" style="margin-top:12px"><input type="checkbox" id="replace"> Replace rosters of classes with the same name (otherwise new students are added and existing ones kept)</label>
      <div class="row" style="margin-top:14px"><div class="spacer"></div><button class="btn" id="x">Cancel</button><button class="btn primary" id="go" ${total ? '' : 'disabled'}>Import ${total} students</button></div>`;
    $$('[data-map]', m).forEach(sel => sel.onchange = () => { mp.g[sel.dataset.map] = +sel.value; if (sel.dataset.map === 'full' && +sel.value >= 0) { mp.g.first = mp.g.last = -1; } if ((sel.dataset.map === 'first' || sel.dataset.map === 'last') && +sel.value >= 0) mp.g.full = -1; draw(); });
    $('#hdr', m).onchange = e => { mp.hasHeader = e.target.checked; mp.header = mp.hasHeader ? s.rows[0] : s.rows[0].map((_, i) => `Column ${i + 1}`); if (mp.hasHeader) mp.g = guessColumns(mp.header); draw(); };
    $$('[data-file]', m).forEach(b => b.onclick = () => { fi = +b.dataset.file; draw(); });
    $$('[data-inc]', m).forEach(c => c.onchange = () => { groups[+c.dataset.inc].include = c.checked; draw(); });
    $$('[data-name]', m).forEach(c => c.onchange = () => { groups[+c.dataset.name].name = c.value.trim() || 'Imported class'; });
    $$('[data-per]', m).forEach(c => c.onchange = () => { groups[+c.dataset.per].period = c.value; });
    $('#x', m).onclick = closeModal;
    $('#go', m).onclick = () => {
      const replace = $('#replace', m).checked, chosen = groups.filter(g => g.include && g.students.length);
      setConfig(cf => {
        for (const g of chosen) {
          const ex = cf.classes.find(c => c.name.toLowerCase() === g.name.toLowerCase());
          if (ex) {
            const names = replace ? g.students : [...ex.students.map(s => s.name), ...g.students.filter(n => !ex.students.some(s => s.name.toLowerCase() === shortName(n).toLowerCase()))];
            ex.students = parseRoster(names.join('\n'), ex.students); ex.period = g.period;
          } else cf.classes.push({ id: uid(8), name: g.name, period: g.period, students: parseRoster(g.students.join('\n')), schedule: [] });
        }
      });
      closeModal(); toast(`Imported ${chosen.length} class${chosen.length === 1 ? '' : 'es'}`);
    };
  };
  draw();
}

/* ---------- REPORTS ---------- */
const R = { range: 'week', cls: '', from: isoDate(Date.now() - 30 * DAY), to: isoDate(Date.now()), sort: 'min', student: null };
function reportRange() {
  const now = Date.now();
  switch (R.range) {
    case 'today': return [sod(), now + 1];
    case 'week': return [sow(), now + 1];
    case '7': return [sod() - 6 * DAY, now + 1];
    case 'month': { const d = new Date(); return [+new Date(d.getFullYear(), d.getMonth(), 1), now + 1]; }
    case '30': return [sod() - 29 * DAY, now + 1];
    case 'all': return [0, now + 1];
    default: return [parseDate(R.from), parseDate(R.to) + DAY];
  }

function bulkImport(el) {
  const m = modal(`<h2>Paste all periods</h2>
    <p class="muted small">Start each class with a line beginning <b>#</b>. Put the period in the name ("Period 2" or "P2") and it uses the Earlham bell schedule automatically. Classes with the same name are updated, not duplicated.</p>
    <textarea id="bt" style="min-height:260px" placeholder="# Period 1 · Chemistry
Maya Chen
Jordan Ellis

# P5 · Physics
Priya Shah
Leo Martin

# Advisory
Zoe Park"></textarea>
    <div class="small muted" id="bp"></div>
    <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn" id="x">Cancel</button><button class="btn primary" id="go">Import</button></div>`, { dismiss: false });
  const parse = () => {
    const out = []; let cur = null;
    for (const raw of $('#bt', m).value.split(/\r?\n/)) {
      const l = raw.trim(); if (!l) continue;
      if (l.startsWith('#')) {
        const [name, time] = l.replace(/^#+\s*/, '').split('|').map(s => s.trim());
        const tm = time && time.match(/(\d{1,2}:\d{2})\s*(am|pm)?\s*[-–to]+\s*(\d{1,2}:\d{2})\s*(am|pm)?/i);
        const fix = (t, ap) => { let [h, mm] = t.split(':').map(Number); if (ap) { ap = ap.toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; } else if (h < 6) h += 12; return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
        cur = { name, period: (() => { const pm = name.match(/\b(?:period|per\.?|p)\s*([1-8])\b/i); if (pm) return 'P' + pm[1]; if (/advis/i.test(name)) return 'ADV'; if (/interv/i.test(name)) return 'INT'; return ''; })(), lines: [], schedule: tm ? [{ days: [1, 2, 3, 4, 5], start: fix(tm[1], tm[2]), end: fix(tm[3], tm[4]) }] : null }; out.push(cur);
      } else if (cur) cur.lines.push(l);
    }
    return out;
  };
  $('#bt', m).oninput = () => { const p = parse(); $('#bp', m).textContent = p.length ? p.map(x => `${x.name}: ${x.lines.length} students${x.period && !x.schedule ? ` · ${periodName(x.period)}` : ''}${x.schedule ? ` · ${x.schedule[0].start}–${x.schedule[0].end}` : ''}`).join(' · ') : 'Start a class with a # line.'; };
  $('#x', m).onclick = closeModal;
  $('#go', m).onclick = () => {
    const p = parse(); if (!p.length) return;
    setConfig(cf => {
      for (const x of p) {
        const ex = cf.classes.find(c => c.name.toLowerCase() === x.name.toLowerCase());
        if (ex) { ex.students = parseRoster(x.lines.join('\n'), ex.students); if (x.schedule) { ex.schedule = x.schedule; ex.period = ''; } else if (x.period) ex.period = x.period; }
        else cf.classes.push({ id: uid(8), name: x.name, period: x.schedule ? '' : x.period, students: parseRoster(x.lines.join('\n')), schedule: x.schedule || [] });
      }
    });
    closeModal(); toast(`Imported ${p.length} class${p.length > 1 ? 'es' : ''}`);
  };
}

        <input type="text" class="di" value="${esc(d.icon)}" style="text-align:center;font-size:1.2rem">

        <input type="number" class="dm" min="0" value="${d.max}" title="0 = no limit">
        <input type="number" class="da" min="1" value="${d.alert}">
        <label class="check small x"><input type="checkbox" class="de" ${d.exempt ? 'checked' : ''}> Exempt</label>
        <button class="btn sm ghost danger dr">✕</button></div>`).join('')}
      <div class="row"><button class="btn sm" id="adddest">+ Add destination</button><span class="small muted">Max out: how many can be at that spot at once (0 = no cap). Exempt spots like the nurse skip the room and student limits.</span></div>
    </div>

    <div class="card stack"><h3>Limits</h3>
      <div class="row">
        <label class="field">Max students out at once<input type="number" id="lmo" min="0" value="${c.limits.maxOut}"></label>
        <label class="field">Passes per student per day<input type="number" id="lpd" min="0" value="${c.limits.perDay}"></label>
        <label class="field">Passes per student per week<input type="number" id="lpw" min="0" value="${c.limits.perWeek}"></label>
        <label class="field">No passes first … min<input type="number" id="lfm" min="0" value="${c.limits.firstMin}"></label>
        <label class="field">No passes last … min<input type="number" id="llm" min="0" value="${c.limits.lastMin}"></label>
      </div><p class="small muted">0 turns a limit off. First/last-minute windows use each class's bell times. You can always send a student out from your dashboard.</p>
    </div>

    <div class="card stack"><h3>Alerts</h3>
      <label class="check"><input type="checkbox" id="asnd" ${c.alerts.sound ? 'checked' : ''}> Chime on this laptop when a student goes past the alert time</label>
      <label class="check"><input type="checkbox" id="antf" ${c.alerts.notify ? 'checked' : ''}> Desktop notification too <span class="small muted">${'Notification' in window ? `(permission: ${Notification.permission})` : '(not supported)'}</span></label>
      <div><button class="btn sm" id="tbeep">Test chime</button></div>
    </div>

    <div class="card stack"><h3>Bell schedule</h3>
      <label class="field">Building<select id="school"><option value="hs" ${c.school !== 'ms' ? 'selected' : ''}>High school times</option><option value="ms" ${c.school === 'ms' ? 'selected' : ''}>Middle school times</option></select></label>
      <p class="small muted">The 2026–27 Earlham MS/HS schedules are built in. Mondays are Full days, Tue/Thu Red block days, Wed/Fri White block days. Change a single day (late start, early out, Homecoming…) from <b>Bell schedule…</b> on the Now tab or the kiosk settings.</p>
    </div>

    <div class="card stack"><h3>Kiosk</h3>
      <div class="row">
        <label class="field">Teacher PIN<input type="text" id="kpin" value="${esc(c.kiosk.pin)}" inputmode="numeric" style="width:120px"></label>
        <label class="field">Name button size<select id="ksz">${[['s', 'Small'], ['m', 'Medium'], ['l', 'Large'], ['xl', 'Extra large']].map(([k, l]) => `<option value="${k}" ${c.kiosk.size === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field">Undo window (sec)<input type="number" id="kun" min="2" max="30" value="${c.kiosk.undoSec}"></label>
      </div>
      <label class="check"><input type="checkbox" id="ktm" ${c.kiosk.showTimers ? 'checked' : ''}> Show timers on the kiosk</label>
      <label class="check"><input type="checkbox" id="ksn" ${c.kiosk.shortNames ? 'checked' : ''}> Shorten pasted names to first name + last initial</label>
    </div>

    <div class="card stack"><h3>Look &amp; feel</h3>
      <div class="row">
        <label class="field">App name<input type="text" id="ttl" value="${esc(c.theme.title)}"></label>
        <label class="field">Theme<select id="tmd">${[['auto', 'Match device'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<option value="${k}" ${c.theme.mode === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <div><b class="small">Color presets</b></div>
      <div class="swatches">${PRESETS.map(([n, a, b]) => `<button class="preset ${c.theme.accent === a && c.theme.accent2 === b ? 'on' : ''}" data-pa="${a}" data-pb="${b}"><span class="sw" style="background:${a}"></span><span class="sw" style="background:#fff"></span><span class="sw" style="background:${b}"></span>${n}</button>`).join('')}</div>
      <div class="row"><label class="check small">Main color <input type="color" id="tac" value="${c.theme.accent}"></label><label class="check small">Second color <input type="color" id="tac2" value="${c.theme.accent2 || c.theme.accent}"></label></div>
      <div><b class="small">Logo</b></div>
      <div class="row">
        <span class="logobox">${c.theme.logo === 'default' ? `<img src="${DEFAULT_LOGO}" alt="">` : c.theme.logo ? `<img src="${esc(c.theme.logo)}" alt="">` : `<span style="font-size:40px">${esc(c.theme.emoji)}</span>`}</span>
        <button class="btn sm" id="lgdef">Cardinal</button>
        <label class="btn sm">Upload image…<input type="file" id="lgup" accept="image/*" hidden></label>
        <button class="btn sm" id="lgemo">Use an emoji instead</button>
        <label class="field">Emoji<input type="text" id="tem" value="${esc(c.theme.emoji)}" style="width:70px;text-align:center;font-size:1.2rem"></label>
      </div>
    </div>

    <div class="card stack"><h3>Your data</h3>
      ${Cloud.configured() ? `<div class="row" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px">
        ${S.cloudEmail ? `<span>☁️ Saving to the Google Drive of <b>${esc(S.cloudEmail)}</b></span><div class="spacer"></div><button class="btn sm" id="gpush">Save now</button><button class="btn sm ghost danger" id="gout">Sign out</button>`
        : `<span>☁️ Sign in with Google to save everything to your Drive and get it back on any computer.</span><div class="spacer"></div><button class="btn sm primary" id="gin">Sign in with Google</button>`}
      </div>` : ''}
      <p class="small muted">Everything also lives in this browser (and the kiosk's). ${Object.keys(S.passes).length} passes stored.</p>
      <div class="row"><button class="btn" id="bk">Download backup</button><label class="btn">Restore backup<input type="file" id="rs" accept=".json" hidden></label></div>
      <div class="row"><label class="field">Delete passes before<input type="date" id="pd"></label><button class="btn danger" id="pg" style="align-self:flex-end">Delete old passes</button></div>
      <div class="row"><button class="btn danger" id="reset">Reset this device</button><span class="small muted">Wipes everything on this browser.</span></div>
    </div>
  </div>`;
    bind();
  };
  const grab = () => {
    $$('.destrow[data-i]', el).forEach(r => { const d = c.destinations[+r.dataset.i]; d.icon = $('.di', r).value.trim() || '📍'; d.name = $('.dn', r).value.trim() || 'Somewhere'; d.max = Math.max(0, +$('.dm', r).value || 0); d.alert = Math.max(1, +$('.da', r).value || 10); d.exempt = $('.de', r).checked; });
    Object.assign(c.limits, { maxOut: +$('#lmo').value || 0, perDay: +$('#lpd').value || 0, perWeek: +$('#lpw').value || 0, firstMin: +$('#lfm').value || 0, lastMin: +$('#llm').value || 0 });
    c.school = $('#school').value;
    Object.assign(c.alerts, { sound: $('#asnd').checked, notify: $('#antf').checked });
    Object.assign(c.kiosk, { pin: $('#kpin').value.trim() || '1234', size: $('#ksz').value, undoSec: Math.min(30, Math.max(2, +$('#kun').value || 6)), showTimers: $('#ktm').checked, shortNames: $('#ksn').checked });
    Object.assign(c.theme, { title: $('#ttl').value.trim() || 'Hall Pass', emoji: $('#tem').value.trim() || '🐦', mode: $('#tmd').value, accent: $('#tac').value, accent2: $('#tac2').value });
  };
  const bind = () => {
    $('#sv').onclick = () => { grab(); setConfig(cf => { for (const k of ['destinations', 'limits', 'alerts', 'kiosk', 'theme', 'school']) cf[k] = c[k]; }); toast('Settings saved and sent to the kiosk'); };
    $('#adddest').onclick = () => { grab(); c.destinations.push({ id: uid(6), name: '', icon: '📍', max: 1, alert: 10, exempt: false }); draw(); };
    $$('.dr', el).forEach(b => b.onclick = () => { grab(); c.destinations.splice(+b.closest('.destrow').dataset.i, 1); draw(); });
    $$('[data-pa]', el).forEach(b => b.onclick = () => { grab(); c.theme.accent = b.dataset.pa; c.theme.accent2 = b.dataset.pb; draw(); });
    $('#lgdef').onclick = () => { grab(); c.theme.logo = 'default'; draw(); };
    $('#lgemo').onclick = () => { grab(); c.theme.logo = ''; draw(); };
    $('#lgup').onchange = e => { const f = e.target.files[0]; if (!f) return; grab(); shrinkImage(f, 320).then(u => { c.theme.logo = u; draw(); }).catch(() => toast("Couldn't read that image")); };
    $('#antf').onchange = e => { if (e.target.checked && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission(); };
    $('#tbeep').onclick = () => { const s = C().alerts.sound; C().alerts.sound = true; beep(); C().alerts.sound = s; };
    $('#gin') && ($('#gin').onclick = () => { Cloud.onSignedIn = () => renderTeacher(); Cloud.signIn(false); });
    $('#gout') && ($('#gout').onclick = () => { if (confirm('Stop saving to Google Drive on this computer? Your Drive copy stays.')) Cloud.signOut(); });
    $('#gpush') && ($('#gpush').onclick = () => Cloud.valid() ? Cloud.push().then(() => toast('Saved to Google Drive')) : Cloud.signIn(true));
    $('#bk').onclick = () => download(`hallpass-backup-${isoDate(Date.now())}.json`, JSON.stringify({ app: 'hallpass', v: 1, config: C(), passes: S.passes }, null, 1), 'application/json');
    $('#rs').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (d.app !== 'hallpass') throw 0; d.config.v = Date.now(); mergeIn({ config: d.config, passes: d.passes }); Sync.send({ t: 'full', ...snapshot() }); toast('Backup restored'); renderTeacher(); }
      catch { toast("That doesn't look like a Hall Pass backup"); }
    };
    $('#pg').onclick = () => { const v = $('#pd').value; if (!v) return toast('Pick a date first'); const t = parseDate(v); const n = Object.values(S.passes).filter(p => p.out < t).length; if (confirm(`Delete ${n} passes from before ${v} on both devices? Download a backup first if you might need them.`)) { setConfig(cf => { cf.purgeBefore = Math.max(cf.purgeBefore || 0, t); }, { quiet: true }); purge(); save(); toast(`Deleted ${n} passes`); renderTeacher(); } };
    $('#reset').onclick = () => { if (confirm('Erase all classes, passes and settings on this browser?') && confirm('Really? This cannot be undone.')) { Sync.stopPeer(); localStorage.removeItem(LS); location.href = location.pathname; } };
  };
  draw();
}

function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src); res(cv.toDataURL('image/png'));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

/* ---------- PAIR ---------- */
// Where the app is hosted. A QR code can only work if it points at a real web address
// (not a downloaded file or an in-app preview), so the teacher can type the GitHub Pages URL.
const hereUrl = () => (/^https?:$/.test(location.protocol) && location.origin !== 'null' && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) ? location.origin + location.pathname : '';
const siteUrl = () => (S.siteUrl || hereUrl() || '').trim();
function normalizeSite(u) {
  u = u.trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return x.origin + x.pathname; } catch { return ''; }
}
function viewPair(el) {
  const site = siteUrl();
  const link = S.pairCode && site ? `${site}#pair=${S.pairCode}` : '';
  el.innerHTML = `<div class="stack">
    <h2>Link the kiosk</h2>
    <div class="grid2">
      <div class="card stack">
        ${!S.pairCode ? `<p>Make a private pair code. Your laptop and the kiosk use it to find each other, then talk directly over an encrypted connection.</p>
          <div><button class="btn primary" id="mk">Create pair code</button></div>
          <hr style="border:0;border-top:1px solid var(--line);width:100%">
          <h3>Already have a kiosk set up?</h3>
          <p class="small muted">Reconnect with its pair code and your classes, settings and passes come back from the kiosk. Find the code on the kiosk under ⚙︎ → PIN.</p>
          <div class="row"><input type="text" id="rc" placeholder="Pair code" autocapitalize="off" autocomplete="off" style="font-family:ui-monospace,monospace;letter-spacing:.08em"><button class="btn primary" id="rcgo">Reconnect</button></div>` : `
          <label class="field">Your site's web address
            <div class="row"><input type="text" id="site" value="${esc(S.siteUrl || hereUrl())}" placeholder="yourname.github.io/hallpass" style="flex:1;min-width:220px"><button class="btn sm" id="siteSave">Update QR</button></div></label>
          ${!site ? `<p class="small" style="color:var(--warn)">This page isn't open from a web address the tablet can reach (it looks like a downloaded file or a preview). Type your GitHub Pages address above to make the QR code, or use the pair code below instead.</p>` : ''}
          <div class="row" style="align-items:flex-start;gap:20px">
            ${link ? `<div class="qr" id="qr"></div>` : ''}
            <div class="stack" style="gap:8px"><div class="small muted">Pair code</div><span class="code">${esc(S.pairCode)}</span>
              ${link ? `<button class="btn sm" id="cp">Copy link</button><span class="small muted" style="max-width:240px;word-break:break-all">${esc(link)}</span>` : ''}</div>
          </div>
          <div class="small muted"><b>On the tablet:</b> ${link ? 'scan the code with the camera and open the link, <i>or</i> ' : ''}open ${site ? `<b>${esc(site.replace(/^https?:\/\//, ''))}</b>` : 'your site'}, tap <b>This is the kiosk by the door</b>, then type the pair code.</div>
          <div class="card stack" style="background:var(--panel-2);box-shadow:none;padding:14px">
            <b>⭐ Bookmark your teacher link</b>
            <span class="small muted">If Chrome ever forgets your data (cleared history, school settings that wipe sites when Chrome closes, a new computer), open this link and everything comes back from the kiosk in a few seconds.</span>
            <div class="row"><code class="small" style="word-break:break-all;flex:1">${esc((site || location.origin + location.pathname) + '#teacher=' + S.pairCode)}</code><button class="btn sm" id="cpt">Copy</button></div>
            <span class="small muted">Keep it private: anyone with this link can see your hall pass data.</span>
          </div>
          <div class="row"><span class="sync" data-sync>${syncBadge()}</span><div class="spacer"></div><button class="btn sm danger" id="unp">Unlink &amp; make a new code</button></div>`}
      </div>
      <div class="card stack small">
        <h3>How syncing works</h3>
        <p class="muted">A free public PeerJS server only introduces the two devices to each other. Classes and passes go straight from device to device and are saved only in each browser.</p>
        <p class="muted">Both devices must open the app from the <b>same web address</b>, and both need to be online. Keep this page open on your laptop during the day. The kiosk keeps working while the laptop is closed and catches up when it's back.</p>
        <p class="muted">Same computer? <b>Open kiosk on this computer</b> on the Now tab syncs instantly with no pairing.</p>
        <p class="muted">If the badge stays on "Waiting" on school Wi-Fi, the network may block peer-to-peer traffic. Try the tablet on a phone hotspot to check, then ask IT to allow WebRTC.</p>
      </div>
    </div></div>`;
  $('#mk') && ($('#mk').onclick = () => { S.pairCode = uid(10); save(); Sync.startPeer(); boot(); });
  $('#rcgo') && ($('#rcgo').onclick = () => { const v = $('#rc').value.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); if (v.length < 6) return toast('Type the pair code shown on the kiosk'); S.pairCode = v; save(); TAB = 'now'; boot(); toast('Reconnecting to the kiosk…'); });
  $('#rc') && ($('#rc').onkeydown = e => e.key === 'Enter' && $('#rcgo').click());
  $('#cpt') && ($('#cpt').onclick = () => navigator.clipboard?.writeText((site || location.origin + location.pathname) + '#teacher=' + S.pairCode).then(() => toast('Teacher link copied. Bookmark it or save it somewhere safe.')));
  $('#unp') && ($('#unp').onclick = () => { if (confirm('The kiosk will stop syncing until you pair it again. Continue?')) { S.pairCode = uid(10); save(); Sync.startPeer(); viewPair(el); } });
  $('#siteSave') && ($('#siteSave').onclick = () => { const v = $('#site').value; const n = normalizeSite(v); if (v.trim() && !n) return toast("That doesn't look like a web address"); S.siteUrl = n || null; save(); viewPair(el); });
  $('#site') && ($('#site').onkeydown = e => e.key === 'Enter' && $('#siteSave').click());
  $('#cp') && ($('#cp').onclick = () => navigator.clipboard?.writeText(link).then(() => toast('Link copied')));
  if ($('#qr') && window.qrcode) { const q = qrcode(0, 'M'); q.addData(link); q.make(); $('#qr').innerHTML = q.createImgTag(6, 24, 'Pairing QR code'); }
}

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  applyTheme();
  if (!Cloud.loading) { Cloud.loading = true; Cloud.load(); }
  if (!VIEW) return renderSetup();
  autoClose();
  if (!Sync.bc && !Sync.peer) Sync.init(); else Sync.startPeer();
  if (VIEW === 'kiosk') { renderKiosk(); keepAwake(); } else renderTeacher();
  // keep the teacher link in the address bar so any bookmark of this page can restore it
  if (VIEW === 'teacher' && S.role === 'teacher' && S.pairCode && !NS) history.replaceState(null, '', location.pathname + location.search + '#teacher=' + S.pairCode);
  try { navigator.storage?.persist?.(); } catch { }
}
boot();

</script>
</body>
</html>
